name: ML Continuous Integration and Deployment

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up CML
        uses: iterative/setup-cml@v2

      - name: Install dependencies
        run: make install

      - name: Check formatting
        run: make format

      - name: Train model
        run: make train

      - name: Generate evaluation report
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "# Model Evaluation"
            echo
            cat results/metrics.txt
            echo
            echo "## Confusion Matrix"
            echo
            echo "![Confusion Matrix](./results/confusion_matrix.png)"
          } > report.md
          cml comment create report.md

      - name: Deploy to Hugging Face Static Space
        if: github.event_name != 'pull_request'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN || secrets.HF }}
          HF_SPACE_ID: ${{ secrets.HF_SPACE_ID || 'bharani-01/Drug-Classification' }}
        run: |
          TOKEN="${HF_TOKEN}"
          SPACE_ID="${HF_SPACE_ID:-bharani-01/Drug-Classification}"
          if [ -z "$TOKEN" ]; then
            echo "Error: HF_TOKEN secret is not set in GitHub repository secrets."
            echo "Please configure HF_TOKEN in GitHub -> Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          python -m pip install --upgrade huggingface_hub
          python - <<EOF
          import os
          from huggingface_hub import HfApi

          token = os.environ.get("HF_TOKEN")
          space_id = os.environ.get("HF_SPACE_ID", "bharani-01/Drug-Classification").strip()
          print(f"Deploying to Hugging Face Space: {space_id}...")

          api = HfApi(token=token)
          print("Uploading web app files...")
          api.upload_folder(
              folder_path="app",
              repo_id=space_id,
              repo_type="space",
              commit_message="Deploy static ONNX web application",
          )
          print("Uploading model artifacts...")
          api.upload_folder(
              folder_path="model",
              path_in_repo="model",
              repo_id=space_id,
              repo_type="space",
              commit_message="Upload trained model artifacts",
          )
          print("Uploading evaluation results...")
          api.upload_folder(
              folder_path="results",
              path_in_repo="results",
              repo_id=space_id,
              repo_type="space",
              commit_message="Upload evaluation metrics and plots",
          )
          print("Deployment to Hugging Face successfully completed!")
          EOF
